# Render blueprint — deploy Savora as a free web service.
# 1. Push this repo to GitHub (already done).
# 2. Go to https://dashboard.render.com → New → Blueprint → pick this repo.
# 3. Render reads this file and provisions the service. Done.
services:
  - type: web
    name: savora
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Add Stripe / email keys here later (see .env.example), or in the dashboard.
